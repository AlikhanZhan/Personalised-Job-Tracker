name: Check for new grad roles

on:
  schedule:
    # Runs at 08:00 UTC every day. Adjust as you like — cron syntax is
    # minute hour day month weekday.
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit updated state
        run: |
          git config --global user.name "grad-tracker-bot"
          git config --global user.email "actions@github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update tracked roles [skip ci]"
          git push
